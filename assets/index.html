    * {
      padding: unset;
      box-sizing: border-box;
      margin: unset;

    body {
      display: flex;
      justify-content: center;
      font-family: "IBM Plex Serif";
      padding: 48px 16px 64px;

      /* background: #202020; */
      /* color: #f0f0f0;   */
    }

    .gallery {
      display: flex;
      flex-direction: column;

      max-width: 720px;
      gap: 48px;
    }

    .num {
      position: absolute;
      right: 8%;
      bottom: 4%;

      font-size: 0.75rem;
      font-family: "IBM Plex Mono";
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      /* filter: invert(1); */
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 16px;

      /* page-break-before: always; */
      page-break-inside: avoid;
    }

    @page {
      .section {
      }
    }

    h3 {
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);

      max-width: 100%;

      gap: 16px;
    }

    figure {
      grid-column: span 2;
      grid-row: span 2;
      border: 1px solid;
      margin: 0;
      width: 100%;
      min-width: 0;

      position: relative;

      /* background-color: #282828; */
    }

    .m2 {
      grid-column: span 2;
      grid-row: span 2;
    }
    .m3 {
      grid-column: span 3;
      grid-row: span 3;
    }
    .m4 {
      grid-column: span 4;
      grid-row: span 4;
    }
    .m6 {
      grid-column: span 6;
      grid-row: span 6;
    }
    .m8 {
      grid-column: span 8;
      grid-row: span 8;
    }
    .m9 {
      grid-column: span 9;
      grid-row: span 9;
    }
    .m12 {
      grid-column: span 12;
      grid-row: span 12;
    }
  </style>
