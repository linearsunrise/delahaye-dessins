indentation: 2
column-limit: 70
function-arrows: leading-args
comma-style: leading
record-style: aligned
import-grouping:
  - name: "Local imports"
    rules:
      - scope: local
  - name: "External  imports"
    rules:
      - scope: external
  - name: "Libs"
    rules:
      - glob: "Dessins**"
  - name: "Local unqualified"
    rules:
      - scope: local
        qualified: no
  - name: "Local qualified"
    rules:
      - scope: local
        qualified: yes
  - name: "The rest"
    rules:
      - priority: 100
import-export-style: leading
indent-wheres: true
record-brace-space: true
newlines-between-decls: 1
haddock-style: multi-line
haddock-style-module: multi-line
haddock-location-signature: leading
let-style: inline
in-style: right-align
if-style: hanging
single-constraint-parens: always
single-deriving-parens: always
sort-constraints: true
sort-derived-classes: true
sort-deriving-clauses: true
trailing-section-operators: true
unicode: never
respectful: false
fixities:
  - infixr 9  .
  - infixr 5  ++
  - infixl 4  <$
  - infixl 1  >>, >>=
  - infixr 1  =<<
  - infixr 0  $, $!
  - infixl 4 <*>, <*, *>, <**>
  - infixr 3 >~<
  - infixr 3.3 |~|
  - infixr 3.7 <~>
local-modules:
  - Dessins
  - Dessins.Utils
  - Dessins.Utils.Grid
  - Dessins.Utils.Polygon
  - Dessins.Utils.Scene
  - Dessins.Const
  - Dessins.Types
  - Dessins.Figures
  - Dessins.Figures.PolygonesReguliers
  - Dessins.Figures.EtoilesRegulieres